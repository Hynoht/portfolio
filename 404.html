<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#020617">
    <title>404 — Page introuvable | Arthinez</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020617;
            color: #f8fafc;
            font-family: "JetBrains Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        .terminal {
            background: #0e1223;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.6);
            max-width: 560px;
            width: 100%;
        }
        .bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #1a1e2f;
            border-bottom: 1px solid #334155;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot:nth-child(1) { background: #ef4444; }
        .dot:nth-child(2) { background: #eab308; }
        .dot:nth-child(3) { background: #22c55e; }
        .body { padding: 28px 24px; font-size: 15px; }
        .prompt { color: #22c55e; }
        .muted { color: #94a3b8; }
        .err { color: #ef4444; }
        h1 { font-size: 1.2rem; margin: 14px 0; font-weight: 600; }
        p { margin-bottom: 14px; color: #94a3b8; }
        a.btn {
            display: inline-block;
            margin-top: 8px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #22c55e;
            color: #052e16;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        a.btn:hover { background: #16a34a; }
        a.btn:focus-visible { outline: 2px solid #22c55e; outline-offset: 3px; }
    </style>
</head>

<body>
    <main class="terminal">
        <div class="bar" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="body">
            <div><span class="prompt">➜ ~</span> curl https://arthinez.netlify.app/cette-page</div>
            <h1><span class="err">Erreur 404</span> — page introuvable / page not found</h1>
            <p class="muted">Le fichier demandé n'existe pas (ou plus). Retournez à l'accueil pour découvrir mes projets, compétences et expériences.</p>
            <a class="btn" href="/">cd ~ — retour à l'accueil</a>
        </div>
    </main>
</body>

</html>
